apiVersion: apps/v1
kind: Deployment

metadata:
  name: postgres-deployment
  
spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
        - name: postgres

          image: postgres:16

          env:
            - name: POSTGRES_USER
              value: greenops

            - name: POSTGRES_PASSWORD
              value: greenops

            - name: POSTGRES_DB
              value: greenops

          ports:
            - containerPort: 5432