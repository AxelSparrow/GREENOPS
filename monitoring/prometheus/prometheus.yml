global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "auth-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["auth-service:8000"]

  - job_name: "metrics-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["metrics-service:8000"]

  - job_name: "alert-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["alert-service:8000"]